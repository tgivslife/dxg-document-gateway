name: dxg-poc

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  ext-proxy:
    <<: *app
    image: dxg/proxy:poc
    ports: ["127.0.0.1:8080:8443"]
    networks: [ext-console, ext-core]
    secrets: [ext_console_tls]

  ext-app:
    <<: *app
    image: dxg/ext-app:poc
    networks: [ext-core, ext-sanitize, ext-validate, ext-updates, ext-release-call, ext-to-import, ext-to-export]
    volumes:
      - ./folders/intake:/srv/dxg/intake
      - ext-evidence:/srv/dxg/evidence
    secrets: [ext_package_sign, ext_db_password, ext_validator_key, sftp_ext_import, sftp_ext_export, agent_ext, release_ext]

  ext-release:
    <<: *app
    image: dxg/ext-release:poc
    networks: [ext-release-call, ext-release-db, ext-pki]
    volumes:
      - ./folders/outtake:/srv/dxg/outtake
    secrets: [ext_release_enc, ext_release_db_password, ext_release_pki_key]

  ext-postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [ext-core, ext-release-db]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/ext_db_password
    volumes: [ext-db:/var/lib/postgresql/data]
    secrets: [ext_db_password]

  ext-validator:
    <<: *app
    image: dxg/esign-api:poc
    networks: [ext-validate, ext-trust-incoming]

  ext-egress:
    image: dxg/squid:poc
    restart: unless-stopped
    networks: [ext-updates, ext-trust-incoming, outside]

  dmz-import:
    image: dxg/sftp:poc
    restart: unless-stopped
    networks: [ext-to-import, int-to-import]
    volumes: [dmz-import:/srv/xfer]

  dmz-export:
    image: dxg/sftp:poc
    restart: unless-stopped
    networks: [ext-to-export, int-to-export]
    volumes: [dmz-export:/srv/xfer]

  int-proxy:
    <<: *app
    image: dxg/proxy:poc
    ports: ["127.0.0.1:8081:8443"]
    networks: [int-console, int-core]
    secrets: [int_console_tls]

  int-app:
    <<: *app
    image: dxg/int-app:poc
    networks: [int-core, int-pki, int-verify, int-to-export]
    volumes:
      - int-documents:/srv/dxg/documents
      - ./folders/responses:/srv/dxg/responses
    secrets: [int_package_sign, int_db_password, int_pki_key, sftp_int_export, verifier_int]

  int-verifier:
    <<: *app
    image: dxg/int-verifier:poc
    networks: [int-verify, int-to-import]
    shm_size: 512m
    secrets: [int_import_enc, sftp_int_import]

  int-postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [int-core]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/int_db_password
    volumes: [int-db:/var/lib/postgresql/data]
    secrets: [int_db_password]

  # Stand-in for the organisation's shared PKI service. Like the real one, it is
  # reachable from both sides.
  pki-service:
    <<: *app
    image: dxg/esign-api:poc
    networks: [ext-pki, int-pki]

networks:
  outside: {}
  # The two console networks exist only so that the proxies can publish a port.
  # Masquerading is off, so a proxy has no route out.
  ext-console:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  int-console:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  ext-core: { internal: true }
  ext-validate: { internal: true }
  ext-pki: { internal: true }
  int-pki: { internal: true }
  ext-release-call: { internal: true }
  ext-release-db: { internal: true }
  ext-updates: { internal: true }
  ext-trust-incoming: { internal: true }
  ext-to-import: { internal: true }
  ext-to-export: { internal: true }
  int-to-import: { internal: true }
  int-to-export: { internal: true }
  int-core: { internal: true }
  int-verify: { internal: true }
  ext-sanitize:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-ext-san
    ipam:
      config: [{ subnet: 172.30.10.0/24 }]

volumes:
  ext-evidence: {}
  ext-db: {}
  int-db: {}
  int-documents: {}
  dmz-import: {}
  dmz-export: {}

secrets:
  ext_package_sign: { file: ./secrets/ext-package-sign.pem }
  ext_release_enc: { file: ./secrets/ext-release-enc.pem }
  ext_db_password: { file: ./secrets/ext-db-password }
  ext_release_db_password: { file: ./secrets/ext-release-db-password }
  ext_validator_key: { file: ./secrets/ext-validator-key }
  ext_console_tls: { file: ./secrets/ext-console-tls.pem }
  ext_release_pki_key: { file: ./secrets/ext-release-pki-key }
  sftp_ext_import: { file: ./secrets/sftp-ext-import }
  sftp_ext_export: { file: ./secrets/sftp-ext-export }
  release_ext: { file: ./secrets/release-ext }
  agent_ext: { file: ./secrets/agent-ext }
  int_package_sign: { file: ./secrets/int-package-sign.pem }
  int_import_enc: { file: ./secrets/int-import-enc.pem }
  int_db_password: { file: ./secrets/int-db-password }
  int_pki_key: { file: ./secrets/int-pki-key }
  int_console_tls: { file: ./secrets/int-console-tls.pem }
  sftp_int_export: { file: ./secrets/sftp-int-export }
  sftp_int_import: { file: ./secrets/sftp-int-import }
  verifier_int: { file: ./secrets/verifier-int }
